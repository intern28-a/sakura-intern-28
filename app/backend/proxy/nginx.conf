# Sakuravel リバースプロキシ（TLS 終端 / 単一オリジン化）
#
# このアプリは SSE でユーザーごとに常時接続を保持する。通常の
# 「リクエストが来て返して閉じる」前提の既定値では足りないため、
# 接続数とワーカーの停止まわりを明示的に設定している。

user  nginx;
worker_processes auto;

# SSE の常時接続ぶんファイルディスクリプタを確保する
worker_rlimit_nofile 65535;

# reload しても SSE を掴んだままの旧ワーカーが永久に残らないようにする
worker_shutdown_timeout 30s;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    # ログイン中のユーザーは通知SSEを常時1本、スレッド閲覧中はもう1本張る
    worker_connections 8192;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $upstream_response_time がアプリの処理時間、$request_time との差が
    # ネットワーク + TLS の時間。エンドポイント別の継続計測に使う。
    log_format perf '$remote_addr "$request" $status '
                    'req=$request_time upstream=$upstream_response_time '
                    'connect=$upstream_connect_time '
                    'bytes=$body_bytes_sent proto=$server_protocol';
    access_log /var/log/nginx/access.log perf;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;
    client_max_body_size 1m;
    server_tokens     off;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_vary       on;
    # text/event-stream は絶対に入れないこと。圧縮すると SSE のイベントが遅延する。
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # 流量制御のゾーン定義。重いエンドポイントへの limit_req の適用は
    # 計測してから判断するため、ここでは定義だけしておく。
    limit_req_zone  $binary_remote_addr zone=api_heavy:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=sse_conn:10m;

    upstream backend_api {
        server api:8080;
        # 上流への接続を使い回す（proxy_http_version 1.1 + Connection "" とセット）
        keepalive 64;
    }

    upstream frontend_app {
        server frontend:3000;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
