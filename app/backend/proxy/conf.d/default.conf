# server_name は _ （任意のホスト名）にしている。
# ローカルの localhost と本番の <IP>.sslip.io で同じ設定をそのまま使うため。

server {
    listen      80;
    listen [::]:80;
    server_name _;

    # 証明書の発行・更新に使う。ここだけは HTTPS へリダイレクトしない。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 の多重化により、単一オリジンでもブラウザの 1オリジン6接続制限に
    # SSE が引っかからなくなる。単一オリジン化はこれとセットで成立する。
    http2       on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 検証中は短くしておく。長い max-age は当該ブラウザで事実上ロールバックできない。
    add_header Strict-Transport-Security "max-age=300" always;

    proxy_http_version 1.1;
    proxy_set_header   Connection "";           # upstream keepalive を有効にする
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # バックエンド API。proxy_pass の末尾スラッシュで /backend プレフィックスを除去する。
    #   /backend/posts  ->  api:8080/posts
    location /backend/ {
        proxy_pass http://backend_api/;

        # SSE の keep-alive ping は25秒間隔。既定60秒でも切れないが余裕を持たせる。
        # レスポンスのバッファリングはアプリが返す X-Accel-Buffering: no で
        # 自動的に無効化されるため、SSE 専用の location を分ける必要はない。
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # フロントエンド（Next.js）。/api/config もこちらが処理する。
    location / {
        proxy_pass http://frontend_app;
        proxy_read_timeout 60s;
    }
}
