services:
  api:
    image: <作成したコンテナレジストリのホスト名>/intern2026-app-backend:latest
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - PORT=8080
      # フロントが別オリジンになる場合に指定（未指定だと http://localhost:3000 のみ許可）
      # - ALLOWED_ORIGIN=http://203.0.113.10:3000
      # - COOKIE_SECURE=true   # HTTPS 配信時
    restart: on-failure

  frontend:
    image: <作成したコンテナレジストリのホスト名>/intern2026-app-frontend:latest
    platform: linux/amd64
    ports:
      - "3000:3000"
    environment:
      # ブラウザから直接叩くURL。デプロイ先ではドメイン名やグローバルIPに変更する
      # （例: http://203.0.113.10:8080）
      - API_URL=${API_URL:-http://localhost:8080}
    depends_on:
      - api
    restart: on-failure

networks:
  default:
    name: app-network
