---
# group_vars/all.yml として配置する。ここには秘密情報だけを置く。
#
# アドレス・ポート・役割は Terraform の出力を単一の出典とし、
# deploy.sh → bootstrap.yml が group_vars/app.yml を自動生成する。
# そちらに含まれるもの (手で書かないこと):
#   app_url / api_url / lb_frontend / lb_api / frontend_port / api_port / db_host
#   node_private_ips / node_public_ips / node_roles
#   app_net_cidr / pub_network / dns_servers

registry_host: intern-fuga.sakuracr.jp
registry_username: YOUR_REGISTRY_USERNAME
registry_password: YOUR_REGISTRY_PASSWORD

# Terraform で作成したマネージド DB。db_host は deploy.sh が生成する。
db_port: 3306
db_name: sakuravel_app
db_user: sakuravel_app
db_password: YOUR_MANAGED_DB_PASSWORD
