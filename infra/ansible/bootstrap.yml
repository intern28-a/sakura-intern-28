---
- name: Bootstrap Ansible controller on edge
  hosts: all
  become: true
  vars:
    controller_dir: /opt/sakuravel-ansible
    ssh_key_source: "{{ lookup('env', 'HOME') }}/.ssh/intern28"
    ssh_key_destination: /home/ubuntu/.ssh/intern28
    registry_host: intern-fuga.sakuracr.jp
    db_port: 3306
    db_name: sakuravel_app
    db_user: sakuravel_app

    # 以下は deploy.sh が Terraform の出力から -e で渡す。ここには書かない。
    #   app_url / api_url        アプリの入口と同一オリジンAPIパス
    #   node_private_ips         ノード名 → app セグメントのIP
    #   node_public_ips          ノード名 → ルータ+スイッチ側のグローバルIP
    #   node_roles               ノード名 → frontend / api
    #   dns_servers / pub_network / db_host
    #
    # node_roles のキーがアプリを載せるノード (node-02〜05)。edge は含まれない。
    app_private_ips: "{{ node_roles.keys() | map('extract', node_private_ips) | list }}"

  tasks:
    - name: Install Ansible controller packages
      ansible.builtin.apt:
        name:
          - ansible-core
          - git
          - openssh-client
          - mariadb-client
        state: present
        update_cache: true
        cache_valid_time: 3600

    # node-02〜05 はルータ+スイッチ側に自前のデフォルトルートを持つようになったため、
    # edge の NAT は不要になった。以前設定した MASQUERADE が残っていると
    # 経路が二重になって紛らわしいので明示的に落とす。
    - name: Remove obsolete application NAT rule
      ansible.builtin.command: iptables -t nat -D POSTROUTING -s 192.168.1.0/24 -o {{ ansible_default_ipv4.interface }} -j MASQUERADE
      register: nat_rule_removed
      changed_when: nat_rule_removed.rc == 0
      failed_when: false

    - name: Ensure persistent firewall directory exists
      ansible.builtin.file:
        path: /etc/iptables
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: nat_rule_removed.rc == 0

    - name: Persist firewall rules after NAT removal
      ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4
      when: nat_rule_removed.rc == 0
      changed_when: true

    - name: Create SSH directory for ubuntu
      ansible.builtin.file:
        path: /home/ubuntu/.ssh
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0700'

    - name: Copy intern28 private key to the edge controller
      ansible.builtin.copy:
        src: "{{ ssh_key_source }}"
        dest: "{{ ssh_key_destination }}"
        owner: ubuntu
        group: ubuntu
        mode: '0600'
      no_log: true

    - name: Scan application node SSH host keys
      ansible.builtin.command: "ssh-keyscan -T 5 -H {{ item }}"
      loop: "{{ app_private_ips }}"
      register: app_host_keys
      changed_when: false
      retries: 30
      delay: 10
      until: app_host_keys.rc == 0 and app_host_keys.stdout | length > 0

    - name: Register application node SSH host keys
      ansible.builtin.known_hosts:
        name: "{{ item.item }}"
        key: "{{ item.stdout }}"
        path: /home/ubuntu/.ssh/known_hosts
      loop: "{{ app_host_keys.results }}"

    - name: Create controller directories
      ansible.builtin.file:
        path: "{{ controller_dir }}/{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      loop:
        - group_vars
        - migrations
        - scripts
        - templates

    - name: Copy controller files to the edge controller
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ controller_dir }}/{{ item.dest }}"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      loop:
        - { src: "{{ playbook_dir }}/ansible.cfg", dest: "ansible.cfg" }
        - { src: "{{ playbook_dir }}/site.yml", dest: "site.yml" }
        - { src: "{{ playbook_dir }}/templates/inventory.private.ini.j2", dest: "templates/inventory.private.ini.j2" }
        - { src: "{{ playbook_dir }}/templates/compose.yml.j2", dest: "templates/compose.yml.j2" }
        - { src: "{{ playbook_dir }}/templates/netplan.yaml.j2", dest: "templates/netplan.yaml.j2" }
        - { src: "{{ playbook_dir }}/templates/nginx.conf.j2", dest: "templates/nginx.conf.j2" }
        - { src: "{{ playbook_dir }}/templates/certbot-auth-hook.sh.j2", dest: "templates/certbot-auth-hook.sh.j2" }
        - { src: "{{ playbook_dir }}/templates/certbot-cleanup-hook.sh.j2", dest: "templates/certbot-cleanup-hook.sh.j2" }
        - { src: "{{ playbook_dir }}/templates/certbot-deploy-hook.sh.j2", dest: "templates/certbot-deploy-hook.sh.j2" }
        - { src: "{{ playbook_dir }}/templates/certbot-run.sh.j2", dest: "templates/certbot-run.sh.j2" }
        - { src: "{{ playbook_dir }}/templates/certbot.Dockerfile.j2", dest: "templates/certbot.Dockerfile.j2" }
        - { src: "{{ playbook_dir }}/group_vars/all.yml", dest: "group_vars/all.yml" }
        - { src: "{{ playbook_dir }}/../../app/backend/migrations/001_init.sql", dest: "migrations/001_init.sql" }
        - { src: "{{ playbook_dir }}/../../app/backend/migrations/002_add_idx.sql", dest: "migrations/002_add_idx.sql" }
        - { src: "{{ playbook_dir }}/../../app/backend/migrations/003_add_fk.sql", dest: "migrations/003_add_fk.sql" }
        - { src: "{{ playbook_dir }}/../../app/backend/migrations/004_perf_idx.sql", dest: "migrations/004_perf_idx.sql" }
        - { src: "{{ playbook_dir }}/../../app/backend/migrations/005_post_ranking.sql", dest: "migrations/005_post_ranking.sql" }
        - { src: "{{ playbook_dir }}/../../app/backend/migrations/006_post_ranking_event.sql", dest: "migrations/006_post_ranking_event.sql" }
        - { src: "{{ playbook_dir }}/scripts/run-migrations.sh", dest: "scripts/run-migrations.sh" }

    - name: Render private inventory for the application nodes
      ansible.builtin.template:
        src: inventory.private.ini.j2
        dest: "{{ controller_dir }}/inventory.private.ini"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    # Terraform 由来の値を controller 側の group_vars に落とす。
    # group_vars/all.yml (手で用意する秘密情報) とは別ファイルにして、
    # 自動生成分が手書き分を潰さないようにする。
    - name: Render Terraform-derived group vars for app nodes
      ansible.builtin.template:
        src: app.yml.j2
        dest: "{{ controller_dir }}/group_vars/app.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
