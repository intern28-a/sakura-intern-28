---
- name: Deploy application to app nodes
  hosts: app
  become: true
  vars:
    app_dir: /opt/sakuravel

    tls_role: "{{ 'frontend' if inventory_hostname in groups['frontend'] else 'api' }}"
    tls_name: "{{ tls_frontend_name if tls_role == 'frontend' else tls_api_name }}"
    tls_peer: "{{ (groups[tls_role] | difference([inventory_hostname]) | first) }}"
    tls_peer_ip: "{{ node_private_ips[tls_peer] }}"
    tls_is_leader: "{{ inventory_hostname == groups[tls_role][0] }}"
    tls_domain_cert_name: "{{ tls_role }}-domains"
    tls_domain_names: "{{ tls_domains | default([]) }}"
    tls_server_names: "{{ [tls_name] + (tls_domain_names if tls_role == 'frontend' else []) }}"

    # このノードが lo に持つ VIP。役割で向き先のロードバランサが変わる。
    node_vip: "{{ lb_frontend.vip if inventory_hostname in groups['frontend'] else lb_api.vip }}"

  tasks:
    - name: Wait for cloud-init apt operations to finish
      ansible.builtin.shell: |
        for attempt in $(seq 1 120); do
          if fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1 \
            || systemctl is-active --quiet apt-daily.service \
            || systemctl is-active --quiet apt-daily-upgrade.service; then
            sleep 5
          else
            exit 0
          fi
        done
        echo "timed out waiting for apt locks" >&2
        exit 1
      changed_when: false

    - name: Install nginx and certificate tooling prerequisites
      ansible.builtin.apt:
        name:
          - nginx
          - openssl
        state: present
        update_cache: true

    - name: Create TLS and ACME directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /etc/sakuravel/tls/{{ tls_name }}
        - /var/www/certbot/.well-known/acme-challenge

    - name: Create domain TLS directory on frontend nodes
      ansible.builtin.file:
        path: /etc/sakuravel/tls/{{ tls_domain_cert_name }}
        state: directory
        owner: root
        group: root
        mode: '0755'
      when:
        - tls_role == 'frontend'
        - tls_domain_names | length > 0

    - name: Create temporary self-signed certificate before ACME issuance
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -nodes -newkey rsa:2048 -days 1
          -keyout /etc/sakuravel/tls/{{ tls_name }}/privkey.pem
          -out /etc/sakuravel/tls/{{ tls_name }}/fullchain.pem
          -subj /CN={{ tls_name }}
        creates: /etc/sakuravel/tls/{{ tls_name }}/fullchain.pem

    - name: Create temporary domain certificate before ACME issuance
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -nodes -newkey rsa:2048 -days 1
          -keyout /etc/sakuravel/tls/{{ tls_domain_cert_name }}/privkey.pem
          -out /etc/sakuravel/tls/{{ tls_domain_cert_name }}/fullchain.pem
          -subj /CN={{ tls_domain_names[0] }}
        creates: /etc/sakuravel/tls/{{ tls_domain_cert_name }}/fullchain.pem
      when:
        - tls_role == 'frontend'
        - tls_domain_names | length > 0

    - name: Render nginx TLS reverse proxy
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/sakuravel.conf
        owner: root
        group: root
        mode: '0644'
      register: nginx_conf

    - name: Enable nginx TLS reverse proxy
      ansible.builtin.file:
        src: /etc/nginx/sites-available/sakuravel.conf
        dest: /etc/nginx/sites-enabled/sakuravel.conf
        state: link
      register: nginx_link

    - name: Remove nginx default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      register: nginx_default

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Enable and restart nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: restarted
      when: nginx_conf.changed or nginx_link.changed or nginx_default.changed

    - name: Install Docker before building the Certbot image
      ansible.builtin.shell: bash -o pipefail -c 'curl -fsSL https://get.docker.com | sh'
      args:
        creates: /usr/bin/docker

    - name: Enable Docker before running Certbot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Verify Docker is available
      ansible.builtin.command: docker --version
      changed_when: false

    - name: Verify Docker Compose V2 is available
      ansible.builtin.command: docker compose version
      changed_when: false

    - name: Copy SSH key for certificate synchronization
      ansible.builtin.copy:
        src: /home/ubuntu/.ssh/intern28
        dest: /home/ubuntu/.ssh/intern28
        owner: ubuntu
        group: ubuntu
        mode: '0600'
      when: tls_is_leader | bool

    - name: Install Certbot authentication hook on certificate leader
      ansible.builtin.template:
        src: certbot-auth-hook.sh.j2
        dest: /usr/local/sbin/sakuravel-certbot-auth
        owner: root
        group: root
        mode: '0755'
      when: tls_is_leader | bool

    - name: Install Certbot cleanup hook on certificate leader
      ansible.builtin.template:
        src: certbot-cleanup-hook.sh.j2
        dest: /usr/local/sbin/sakuravel-certbot-cleanup
        owner: root
        group: root
        mode: '0755'
      when: tls_is_leader | bool

    - name: Install Certbot deploy hook on certificate leader
      ansible.builtin.template:
        src: certbot-deploy-hook.sh.j2
        dest: /usr/local/sbin/sakuravel-certbot-deploy
        owner: root
        group: root
        mode: '0755'
      when: tls_is_leader | bool

    - name: Install the Certbot container runner on certificate leader
      ansible.builtin.template:
        src: certbot-run.sh.j2
        dest: /usr/local/sbin/sakuravel-certbot-run
        owner: root
        group: root
        mode: '0755'
      when: tls_is_leader | bool

    - name: Create Certbot image build context
      ansible.builtin.file:
        path: /opt/sakuravel-ansible
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: tls_is_leader | bool

    - name: Render the Certbot container Dockerfile on certificate leader
      ansible.builtin.template:
        src: certbot.Dockerfile.j2
        dest: /opt/sakuravel-ansible/certbot.Dockerfile
        owner: root
        group: root
        mode: '0644'
      register: certbot_dockerfile
      when: tls_is_leader | bool

    - name: Check for the Certbot container image on certificate leader
      ansible.builtin.command: docker image inspect sakuravel-certbot:latest
      register: certbot_image
      changed_when: false
      failed_when: false
      when: tls_is_leader | bool

    - name: Build the Certbot container image on certificate leader
      ansible.builtin.command:
        cmd: >-
          docker build --pull -t sakuravel-certbot:latest
          -f /opt/sakuravel-ansible/certbot.Dockerfile /opt/sakuravel-ansible
      when:
        - tls_is_leader | bool
        - certbot_dockerfile.changed or certbot_image.rc != 0

    - name: Check whether the trusted certificate has been issued
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ tls_name }}/fullchain.pem
      register: trusted_certificate

    - name: Check whether the trusted domain certificate has been issued
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ tls_domain_cert_name }}/fullchain.pem
      register: trusted_domain_certificate
      when:
        - tls_role == 'frontend'
        - tls_domain_names | length > 0

    - name: Issue and configure the initial certificate on the leader
      ansible.builtin.command:
        cmd: >-
          /usr/local/sbin/sakuravel-certbot-run certonly --non-interactive --agree-tos
          --manual --preferred-challenges http
          --manual-auth-hook /usr/local/sbin/sakuravel-certbot-auth
          --manual-cleanup-hook /usr/local/sbin/sakuravel-certbot-cleanup
          --deploy-hook "/usr/local/sbin/sakuravel-certbot-deploy {{ tls_name }}"
          --keep-until-expiring --cert-name {{ tls_name }}
          --preferred-profile shortlived --ip-address {{ tls_name }}
      register: initial_certificate
      when:
        - tls_is_leader | bool
        - not trusted_certificate.stat.exists
      no_log: true

    - name: Issue and configure the initial domain certificate on the frontend leader
      ansible.builtin.command:
        cmd: >-
          /usr/local/sbin/sakuravel-certbot-run certonly --non-interactive --agree-tos
          --manual --preferred-challenges http
          --manual-auth-hook /usr/local/sbin/sakuravel-certbot-auth
          --manual-cleanup-hook /usr/local/sbin/sakuravel-certbot-cleanup
          --deploy-hook "/usr/local/sbin/sakuravel-certbot-deploy {{ tls_domain_cert_name }}"
          --keep-until-expiring --cert-name {{ tls_domain_cert_name }}
          {% for domain in tls_domain_names %}--domain {{ domain }} {% endfor %}
      register: initial_domain_certificate
      when:
        - tls_role == 'frontend'
        - tls_is_leader | bool
        - tls_domain_names | length > 0
        - not trusted_domain_certificate.stat.exists
      no_log: true

    - name: Reload nginx after initial certificate issuance
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      when:
        - tls_is_leader | bool
        - >-
          (initial_certificate is defined and initial_certificate.changed) or
          (initial_domain_certificate is defined and initial_domain_certificate.changed)

    - name: Install Certbot renewal service on certificate leader
      ansible.builtin.copy:
        dest: /etc/systemd/system/sakuravel-certbot-renew.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Renew Sakuravel TLS certificates

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c '/usr/local/sbin/sakuravel-certbot-run renew --quiet && /bin/systemctl reload nginx'
      when: tls_is_leader | bool
      register: certbot_service

    - name: Install Certbot renewal timer on certificate leader
      ansible.builtin.copy:
        dest: /etc/systemd/system/sakuravel-certbot-renew.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Renew Sakuravel TLS certificates daily

          [Timer]
          OnCalendar=daily
          RandomizedDelaySec=1h
          Persistent=true

          [Install]
          WantedBy=timers.target
      when: tls_is_leader | bool
      register: certbot_timer

    - name: Enable Certbot renewal timer on certificate leader
      ansible.builtin.systemd:
        name: sakuravel-certbot-renew.timer
        enabled: true
        state: started
        daemon_reload: "{{ certbot_service.changed or certbot_timer.changed }}"
      when: tls_is_leader | bool

    # ------------------------------------------------------------------
    # ネットワーク: ルータ+スイッチ側NICの設定と DSR 実サーバ設定
    #
    # cloud-init は初回起動時にしか走らないため、既存ノードへの反映はここで行う。
    # NIC の並びはサーバへの接続順で [0] ルータ+スイッチ / [1] app スイッチ。
    # グローバル側が先頭なのは API 制約 (2本目以降には接続できない)。
    # ------------------------------------------------------------------
    - name: Enumerate physical interfaces in ifindex order
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ip -o link show | awk -F': ' '{print $2}' | grep -Ev '^(lo|docker0|veth|br-)'
        executable: /bin/bash
      register: nic_list
      changed_when: false

    - name: Verify the router+switch NIC is attached
      ansible.builtin.assert:
        that: nic_list.stdout_lines | length >= 2
        fail_msg: >-
          {{ inventory_hostname }} has interfaces {{ nic_list.stdout_lines }};
          expected two (app switch + router+switch). Run terraform apply first.

    - name: Render netplan configuration
      ansible.builtin.template:
        src: netplan.yaml.j2
        dest: /etc/netplan/60-nic.yaml
        owner: root
        group: root
        mode: '0600'
      vars:
        # グローバル側 (ルータ+スイッチ) は API 制約で必ず NIC[0]。
        public_if: "{{ nic_list.stdout_lines[0] }}"
        private_if: "{{ nic_list.stdout_lines[1] }}"
      register: netplan_conf

    # cloud-init 時代のファイル。edge を指すデフォルトルートが入っているので消す。
    - name: Remove the cloud-init era netplan file
      ansible.builtin.file:
        path: /etc/netplan/60-private-nic.yaml
        state: absent
      register: netplan_old

    - name: Apply netplan
      ansible.builtin.command: netplan apply
      when: netplan_conf.changed or netplan_old.changed

    - name: Configure ARP suppression for DSR
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-dsr.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # lo に付けた VIP でも、Linux は既定で ethernet 側から ARP 応答してしまう。
          # 抑止しないと VIP の ARP に実サーバが答え、ロードバランサを素通りして
          # 特定の1台に固定される。
          net.ipv4.conf.all.arp_ignore = 1
          net.ipv4.conf.all.arp_announce = 2
      register: dsr_sysctl

    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      when: dsr_sysctl.changed

    - name: Point the DSR VIP unit at this node's VIP
      ansible.builtin.copy:
        dest: /etc/systemd/system/dsr-vip.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          # DSR では宛先IPが VIP のまま届くため、VIP を自分のアドレスとして
          # 持っていないとパケットを破棄してしまう。
          Description=Assign DSR loadbalancer VIP to loopback
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/sbin/ip addr replace {{ node_vip }}/32 dev lo
          ExecStop=-/usr/sbin/ip addr del {{ node_vip }}/32 dev lo

          [Install]
          WantedBy=multi-user.target
      register: dsr_vip_unit

    - name: Enable and restart the DSR VIP unit
      ansible.builtin.systemd:
        name: dsr-vip.service
        enabled: true
        state: restarted
        daemon_reload: true
      when: dsr_vip_unit.changed

    # 以前の構成で付けたプライベートVIPが残ると、
    # そのアドレス宛のパケットを黙って受けてしまうので落とす。
    - name: Drop stale VIPs from loopback
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          removed=""
          for addr in $(ip -4 -o addr show dev lo | awk '{print $4}'); do
            case "$addr" in
              127.*) continue ;;
              {{ node_vip }}/32) continue ;;
            esac
            ip addr del "$addr" dev lo
            removed="$removed $addr"
          done
          echo "removed:$removed"
        executable: /bin/bash
      register: stale_vips
      changed_when: stale_vips.stdout != "removed:"

    # :8080 を掴む動作確認用の仮リスナー。api コンテナとポートが衝突する。
    - name: Check for the temporary DSR echo listener
      ansible.builtin.stat:
        path: /etc/systemd/system/dsr-echo.service
      register: dsr_echo_unit

    - name: Disable the temporary DSR echo listener
      ansible.builtin.systemd:
        name: dsr-echo.service
        state: stopped
        enabled: false
      when: dsr_echo_unit.stat.exists

    - name: Remove the temporary DSR echo listener
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/dsr-echo.service
        - /usr/local/bin/dsr-echo-server.py
      when: dsr_echo_unit.stat.exists
      notify: Reload systemd

    - name: Apply database migrations from the Ansible controller
      ansible.builtin.command:
        cmd: bash /opt/sakuravel-ansible/scripts/run-migrations.sh
      environment:
        DB_HOST: "{{ db_host }}"
        DB_PORT: "{{ db_port | string }}"
        DB_USER: "{{ db_user }}"
        DB_NAME: "{{ db_name }}"
        DB_PASSWORD: "{{ db_password }}"
        MIGRATIONS_DIR: /opt/sakuravel-ansible/migrations
      delegate_to: localhost
      run_once: true
      no_log: true

    - name: Login to the private container registry
      ansible.builtin.command:
        cmd: docker login {{ registry_host }} --username {{ registry_username }} --password-stdin
        stdin: "{{ registry_password }}"
      when:
        - registry_username is defined
        - registry_password is defined
      no_log: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Render Compose file
      ansible.builtin.template:
        src: compose.yml.j2
        dest: "{{ app_dir }}/compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    # --remove-orphans: compose.yml から消えたサービス (役割変更前の
    # frontend / api) のコンテナを残さないため。
    - name: Pull and start application
      ansible.builtin.command:
        cmd: docker compose -f compose.yml up -d --pull always --remove-orphans
        chdir: "{{ app_dir }}"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
